<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#d9d9d9"/><stop offset=".55" stop-color="#a9a9a9"/><stop offset="1" stop-color="#7c7c7c"/>
    </linearGradient>
    <linearGradient id="ground" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5a5a5a"/><stop offset=".25" stop-color="#3c3c3c"/><stop offset="1" stop-color="#232323"/>
    </linearGradient>
    <radialGradient id="glow" cx=".5" cy=".42" r=".55">
      <stop offset="0" stop-color="#ffffff" stop-opacity=".55"/><stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <filter id="mist" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="9"/></filter>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="2.2"/></filter>
  </defs>
  <rect width="1280" height="720" fill="url(#sky)"/>
  <rect width="1280" height="720" fill="url(#glow)"/>
  <g fill="#ffffff" opacity=".28" filter="url(#soft)">
    <ellipse cx="210" cy="90" rx="180" ry="26"/><ellipse cx="300" cy="110" rx="140" ry="20"/>
    <ellipse cx="980" cy="70" rx="200" ry="24"/><ellipse cx="1080" cy="96" rx="130" ry="18"/>
    <ellipse cx="620" cy="150" rx="230" ry="22"/>
  </g>
  <!-- floating islands, far -->
  <g fill="#4c4c4c" opacity=".75">
    <polygon points="120,190 260,190 235,235 150,235"/>
    <polygon points="180,150 196,150 196,190 180,190"/><polygon points="205,168 218,168 218,190 205,190"/>
    <polygon points="1020,150 1180,150 1150,200 1050,200"/>
    <polygon points="1080,110 1096,110 1096,150 1080,150"/><polygon points="1112,126 1124,126 1124,150 1112,150"/>
    <polygon points="560,120 700,120 680,160 580,160"/>
  </g>
  <g fill="#3a3a3a" opacity=".85">
    <polygon points="120,190 260,190 235,235 150,235" transform="translate(0,6)"/>
  </g>
  <!-- ruined gothic towers -->
  <g fill="#555" stroke="#333" stroke-width="1.5">
    <path d="M60 560 L60 250 L78 210 L96 250 L96 560 Z"/>
    <path d="M96 560 L96 300 L150 300 L150 340 L132 340 L132 560 Z"/>
    <path d="M1180 560 L1180 220 L1200 175 L1220 220 L1220 560 Z"/>
    <path d="M1120 560 L1120 330 L1180 330 L1180 370 L1160 370 L1160 560 Z"/>
    <path d="M330 560 L330 330 L348 300 L366 330 L366 560 Z"/>
    <path d="M900 560 L900 310 L920 275 L940 310 L940 560 Z"/>
  </g>
  <g fill="#1c1c1c">
    <rect x="70" y="290" width="8" height="16"/><rect x="70" y="340" width="8" height="16"/><rect x="70" y="400" width="8" height="16"/>
    <rect x="1192" y="260" width="8" height="16"/><rect x="1192" y="320" width="8" height="16"/>
    <rect x="340" y="370" width="7" height="14"/><rect x="910" y="350" width="7" height="14"/>
  </g>
  <!-- broken mid towers -->
  <g fill="#6a6a6a" stroke="#3a3a3a" stroke-width="1.5">
    <path d="M180 560 L180 420 L200 400 L214 420 L214 380 L232 400 L232 560 Z"/>
    <path d="M1020 560 L1020 430 L1040 405 L1060 430 L1060 560 Z"/>
  </g>
  <!-- debris -->
  <g fill="#333" opacity=".8">
    <polygon points="480,560 505,545 520,560"/><polygon points="760,560 780,540 800,560"/>
    <polygon points="240,560 258,548 272,560"/><polygon points="1000,560 1022,544 1036,560"/>
  </g>
  <!-- cracked flagstone ground -->
  <polygon points="0,560 1280,560 1280,720 0,720" fill="url(#ground)"/>
  <g stroke="#141414" stroke-width="2" opacity=".85">
    <path d="M0 600 L1280 596"/><path d="M0 645 L1280 650"/><path d="M0 690 L1280 686"/>
    <path d="M120 560 L100 720"/><path d="M330 560 L350 720"/><path d="M560 560 L540 720"/>
    <path d="M760 560 L790 720"/><path d="M980 560 L950 720"/><path d="M1160 560 L1185 720"/>
  </g>
  <g stroke="#0f0f0f" stroke-width="2.5" fill="none" opacity=".9">
    <path d="M420 600 L470 622 L450 648 L500 660"/>
    <path d="M880 610 L840 632 L870 655"/>
    <path d="M180 640 L230 660 L210 690"/>
    <path d="M1050 645 L1100 665 L1080 695"/>
  </g>
  <g fill="#c9c9c9" opacity=".16">
    <ellipse cx="300" cy="660" rx="150" ry="14"/><ellipse cx="900" cy="690" rx="190" ry="16"/><ellipse cx="640" cy="620" rx="120" ry="10"/>
  </g>
  <!-- mist bands -->
  <g fill="#e8e8e8" opacity=".14" filter="url(#mist)">
    <rect x="0" y="500" width="1280" height="70"/><rect x="0" y="600" width="1280" height="46"/>
  </g>
</svg>
