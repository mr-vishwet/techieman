<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" preserveAspectRatio="xMidYMid slice">
  <!-- LEVEL RUN backdrop — FRONT VIEW: the road runs straight AWAY from the
       camera toward a centre vanishing point (640, 560). The CHECKPOINT gate
       is NOT painted here: it is a DOM element (game.js) that starts far/small
       at the vanishing point and grows toward the viewer as the hero runs. -->
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#cfcfcf"/><stop offset=".5" stop-color="#989898"/><stop offset="1" stop-color="#6a6a6a"/>
    </linearGradient>
    <linearGradient id="ground" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4e4e4e"/><stop offset=".35" stop-color="#333"/><stop offset="1" stop-color="#1d1d1d"/>
    </linearGradient>
    <radialGradient id="vpGlow" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#ffffff" stop-opacity=".55"/><stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <filter id="mist" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="9"/></filter>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="2.2"/></filter>
  </defs>
  <rect width="1280" height="720" fill="url(#sky)"/>
  <g fill="#ffffff" opacity=".24" filter="url(#soft)">
    <ellipse cx="180" cy="80" rx="170" ry="24"/><ellipse cx="700" cy="60" rx="200" ry="22"/><ellipse cx="1150" cy="130" rx="150" ry="20"/>
  </g>
  <!-- floating islands + debris -->
  <g fill="#464646" opacity=".8">
    <polygon points="80,170 230,170 205,215 110,215"/>
    <polygon points="420,100 560,100 540,140 440,140"/>
    <polygon points="1080,180 1210,180 1185,220 1105,220"/>
  </g>
  <g fill="#333" opacity=".8">
    <polygon points="300,300 318,290 330,302 312,310"/><polygon points="620,240 636,232 646,244 628,250"/>
    <polygon points="950,330 966,320 978,332 960,340"/>
  </g>
  <!-- ruined towers framing the road, left and right -->
  <g fill="#555" stroke="#333" stroke-width="1.5">
    <path d="M30 560 L30 280 L50 235 L70 280 L70 560 Z"/>
    <path d="M120 560 L120 380 L170 380 L170 420 L150 420 L150 560 Z"/>
    <path d="M220 560 L220 420 L238 390 L256 420 L256 560 Z"/>
    <path d="M1210 560 L1210 280 L1230 235 L1250 280 L1250 560 Z"/>
    <path d="M1110 560 L1110 380 L1160 380 L1160 420 L1140 420 L1140 560 Z"/>
    <path d="M1024 560 L1024 420 L1042 390 L1060 420 L1060 560 Z"/>
  </g>
  <!-- distant broken towers near the vanishing point -->
  <g fill="#6a6a6a" stroke="#444" stroke-width="1.2" opacity=".9">
    <path d="M470 560 L470 470 L482 452 L494 470 L494 560 Z"/>
    <path d="M786 560 L786 470 L798 452 L810 470 L810 560 Z"/>
  </g>
  <!-- light at the end of the road (vanishing point) -->
  <ellipse cx="640" cy="500" rx="220" ry="80" fill="url(#vpGlow)"/>
  <!-- chains across the road -->
  <g stroke="#222" stroke-width="5" fill="none" opacity=".85">
    <path d="M0 150 Q 300 210 640 150 T 1280 140"/>
    <path d="M0 210 Q 320 260 640 210 T 1280 200"/>
  </g>
  <!-- the road itself: trapezoid converging on the vanishing point (640, 560) -->
  <polygon points="0,720 1280,720 720,560 560,560" fill="url(#ground)"/>
  <g stroke="#141414" stroke-width="2.5" opacity=".9" fill="none">
    <path d="M560 560 L0 720"/><path d="M720 560 L1280 720"/>
    <!-- transverse flagstone joints, widening toward the viewer -->
    <path d="M420 600 L860 600"/><path d="M262 645 L1018 645"/><path d="M105 690 L1175 690"/>
    <!-- converging seams from the vanishing point -->
    <path d="M640 560 L200 720" stroke-width="2" opacity=".8"/>
    <path d="M640 560 L480 720" stroke-width="2" opacity=".8"/>
    <path d="M640 560 L800 720" stroke-width="2" opacity=".8"/>
    <path d="M640 560 L1080 720" stroke-width="2" opacity=".8"/>
  </g>
  <!-- cracks in the flagstones -->
  <g stroke="#0f0f0f" stroke-width="2.5" fill="none" opacity=".9">
    <path d="M520 620 L560 640 L540 665"/><path d="M760 640 L810 660 L790 688"/>
    <path d="M400 680 L450 700"/><path d="M900 610 L860 632 L890 655"/>
  </g>
  <g fill="#c9c9c9" opacity=".14">
    <ellipse cx="640" cy="665" rx="220" ry="13"/><ellipse cx="640" cy="700" rx="280" ry="15"/>
  </g>
  <g fill="#e8e8e8" opacity=".14" filter="url(#mist)">
    <rect x="0" y="500" width="1280" height="66"/><rect x="0" y="610" width="1280" height="44"/>
  </g>
</svg>
