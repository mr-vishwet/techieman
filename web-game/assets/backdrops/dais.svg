<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#d5d5d5"/><stop offset=".55" stop-color="#a3a3a3"/><stop offset="1" stop-color="#767676"/>
    </linearGradient>
    <linearGradient id="ground" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#555"/><stop offset=".3" stop-color="#383838"/><stop offset="1" stop-color="#1f1f1f"/>
    </linearGradient>
    <linearGradient id="goldbeam" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffd75e" stop-opacity=".5"/><stop offset="1" stop-color="#ffd75e" stop-opacity="0"/>
    </linearGradient>
    <filter id="mist" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="9"/></filter>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="2.2"/></filter>
  </defs>
  <rect width="1280" height="720" fill="url(#sky)"/>
  <g fill="#ffffff" opacity=".26" filter="url(#soft)">
    <ellipse cx="220" cy="80" rx="170" ry="24"/><ellipse cx="950" cy="64" rx="190" ry="22"/><ellipse cx="620" cy="140" rx="220" ry="20"/>
  </g>
  <!-- floating islands (jagged rock, broken undersides) -->
  <g fill="#484848" opacity=".8">
    <polygon points="90,180 240,180 225,205 200,225 165,210 120,225"/>
    <polygon points="1050,140 1200,140 1180,165 1150,185 1100,170 1080,185"/>
    <polygon points="520,110 660,110 645,130 620,150 580,135 540,150"/>
  </g>
  <!-- ruined towers left + right -->
  <g fill="#555" stroke="#333" stroke-width="1.5">
    <path d="M40 560 L40 260 L60 215 L80 260 L80 560 Z"/>
    <path d="M90 560 L90 330 L140 330 L140 370 L120 370 L120 560 Z"/>
    <path d="M1130 560 L1130 300 L1150 265 L1170 300 L1170 560 Z"/>
    <path d="M300 560 L300 360 L318 330 L336 360 L336 560 Z"/>
  </g>
  <g fill="#1c1c1c">
    <rect x="52" y="300" width="8" height="15"/><rect x="52" y="360" width="8" height="15"/>
    <rect x="1142" y="340" width="8" height="15"/><rect x="310" y="400" width="7" height="13"/>
    <rect x="100" y="380" width="7" height="14"/><rect x="100" y="430" width="7" height="14"/>
  </g>
  <!-- gold light beams over the dais (narrow, focused on the Developer) -->
  <g fill="url(#goldbeam)">
    <polygon points="600,0 652,0 690,560 600,560"/>
    <polygon points="664,0 700,0 740,560 690,560"/>
  </g>
  <!-- chains -->
  <g stroke="#222" stroke-width="5" fill="none" opacity=".8">
    <path d="M0 120 Q 320 190 640 130 T 1280 120"/>
  </g>
  <g fill="#222" opacity=".85">
    <circle cx="160" cy="150" r="7"/><circle cx="320" cy="160" r="7"/><circle cx="480" cy="148" r="7"/>
    <circle cx="800" cy="140" r="7"/><circle cx="960" cy="150" r="7"/><circle cx="1120" cy="138" r="7"/>
  </g>
  <!-- wet reflective ground -->
  <polygon points="0,560 1280,560 1280,720 0,720" fill="url(#ground)"/>
  <g stroke="#141414" stroke-width="2" opacity=".85">
    <path d="M0 598 L1280 594"/><path d="M0 642 L1280 648"/><path d="M0 688 L1280 684"/>
    <path d="M140 560 L120 720"/><path d="M360 560 L380 720"/><path d="M600 560 L585 720"/>
    <path d="M820 560 L850 720"/><path d="M1060 560 L1035 720"/>
  </g>
  <g fill="#d8d8d8" opacity=".2">
    <ellipse cx="640" cy="640" rx="330" ry="20"/><ellipse cx="640" cy="690" rx="420" ry="18"/>
  </g>
  <!-- central dais -->
  <g>
    <ellipse cx="640" cy="620" rx="180" ry="26" fill="#0f0f0f" opacity=".55"/>
    <path d="M500 610 L780 610 L800 640 L480 640 Z" fill="#6f6f6f" stroke="#2c2c2c" stroke-width="2"/>
    <path d="M520 610 L760 610 L770 622 L510 622 Z" fill="#9a9a9a"/>
    <ellipse cx="640" cy="612" rx="150" ry="12" fill="#ffd75e" opacity=".35"/>
  </g>
  <!-- mist -->
  <g fill="#e8e8e8" opacity=".15" filter="url(#mist)">
    <rect x="0" y="500" width="1280" height="66"/><rect x="0" y="610" width="1280" height="44"/>
  </g>
</svg>
