<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 520">
  <defs>
    <filter id="orbGlow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="7" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <!-- tattered cloak, bottom -->
  <path d="M110 380 L 90 500 L 130 480 L 150 505 L 190 482 L 220 508 L 250 484 L 290 502 L 300 380 Z" fill="#0d0d0d"/>
  <!-- legs: blocky stone -->
  <path d="M130 380 L 120 470 L 165 470 L 168 380 Z" fill="#2e2e2e" stroke="#111" stroke-width="2"/>
  <path d="M235 380 L 240 470 L 285 470 L 275 380 Z" fill="#2e2e2e" stroke="#111" stroke-width="2"/>
  <path d="M120 470 L 168 470 L 172 486 L 114 486 Z" fill="#141414"/>
  <path d="M238 470 L 286 470 L 292 486 L 232 486 Z" fill="#141414"/>
  <!-- torso: cracked stone-block letters NULL / POINTER -->
  <path d="M104 150 L 300 150 L 312 380 L 92 380 Z" fill="#3a3a3a" stroke="#161616" stroke-width="3"/>
  <g font-family="Arial Black, Arial, sans-serif" font-weight="900" text-anchor="middle">
    <g font-size="74">
      <text x="206" y="238" fill="#4a4a4a">NULL</text>
      <text x="202" y="234" fill="#7a7a7a">NULL</text>
      <text x="198" y="230" fill="#b5b5b5">NULL</text>
      <text x="196" y="228" fill="#e6e6e6" stroke="#222" stroke-width="1.5">NULL</text>
    </g>
    <g font-size="52">
      <text x="206" y="318" fill="#4a4a4a">POINTER</text>
      <text x="202" y="314" fill="#7a7a7a">POINTER</text>
      <text x="198" y="310" fill="#b5b5b5">POINTER</text>
      <text x="196" y="308" fill="#e6e6e6" stroke="#222" stroke-width="1.5">POINTER</text>
    </g>
  </g>
  <!-- cracks across the letters -->
  <g stroke="#111" stroke-width="2.5" fill="none" opacity=".85">
    <path d="M150 210 L 176 236 L 162 262"/><path d="M250 250 L 232 280 L 252 306"/>
    <path d="M130 320 L 160 340 L 148 366"/><path d="M280 200 L 262 226"/>
  </g>
  <!-- spiked shoulders -->
  <path d="M104 170 L 66 130 L 96 128 L 76 96 L 112 118 L 118 150 Z" fill="#2a2a2a" stroke="#111" stroke-width="2"/>
  <path d="M300 170 L 338 130 L 308 128 L 328 96 L 292 118 L 286 150 Z" fill="#2a2a2a" stroke="#111" stroke-width="2"/>
  <!-- head: small, hooded, red eyes -->
  <path d="M168 148 L 160 96 Q 202 60 244 96 L 236 148 Q 202 162 168 148 Z" fill="#141414"/>
  <ellipse cx="186" cy="116" rx="6" ry="4" fill="#ff2a2a"/>
  <ellipse cx="220" cy="116" rx="6" ry="4" fill="#ff2a2a"/>
  <ellipse cx="186" cy="116" rx="10" ry="7" fill="#ff2a2a" opacity=".25"/>
  <ellipse cx="220" cy="116" rx="10" ry="7" fill="#ff2a2a" opacity=".25"/>
  <!-- left arm: blocky, clawed, holds the Hollow Orb -->
  <path d="M100 180 L 66 260 L 76 330 L 96 330 L 92 260 L 118 200 Z" fill="#2e2e2e" stroke="#111" stroke-width="2"/>
  <circle cx="84" cy="352" r="26" fill="#ffffff" filter="url(#orbGlow)"/>
  <circle cx="84" cy="352" r="26" fill="none" stroke="#999" stroke-width="1.5"/>
  <path d="M70 380 L 62 402 M 82 382 L 80 406 M 94 378 L 100 400" stroke="#111" stroke-width="4" stroke-linecap="round"/>
  <!-- right arm: raised, clawed, throws code -->
  <path d="M304 180 Q 340 150 352 110 L 368 118 Q 356 160 330 196 L 316 200 Z" fill="#2e2e2e" stroke="#111" stroke-width="2"/>
  <path d="M352 110 L 344 88 M 360 112 L 360 86 M 368 116 L 374 92" stroke="#111" stroke-width="4" stroke-linecap="round"/>
  <!-- chest chips: code lines pinned on the cape (see game.js — held lines) -->
  <!-- (in-SVG chip removed: the HTML boss-chips already show the held lines;
       an in-SVG chip here overlapped the POINTER lettering) -->
</svg>
