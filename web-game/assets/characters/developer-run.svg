<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 340">
  <!-- THE DEVELOPER, FRONT VIEW, running TOWARD the camera.
       Chest CODE + face visible; cape streams BEHIND him (wide wings flaring
       out sideways behind the shoulders); one leg drives forward toward the
       viewer (large, foreshortened boot), the other trails back. -->
  <defs>
    <linearGradient id="blade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#bdbdbd"/>
    </linearGradient>
    <linearGradient id="capeSh" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1a1a1a"/><stop offset="1" stop-color="#000"/>
    </linearGradient>
  </defs>
  <!-- ground shadow -->
  <ellipse cx="110" cy="324" rx="68" ry="9" fill="#000" opacity=".3"/>
  <!-- speed lines rushing past -->
  <g stroke="#999" stroke-width="2.5" stroke-linecap="round" opacity=".45" fill="none">
    <line x1="6" y1="190" x2="28" y2="190"/><line x1="192" y1="212" x2="214" y2="212"/><line x1="10" y1="242" x2="26" y2="242"/>
  </g>
  <!-- cape streaming BEHIND him: wide wings flaring out behind the shoulders -->
  <path d="M78 80 Q 30 86 6 130 Q 34 128 18 168 Q 46 160 36 200 Q 62 188 60 224 Q 84 210 92 226 L 128 226 Q 136 210 160 224 Q 158 188 184 200 Q 174 160 202 168 Q 186 128 214 130 Q 190 86 142 80 Q 110 72 78 80 Z" fill="url(#capeSh)" stroke="#3d3d3d" stroke-width="1.5"/>
  <path d="M60 100 Q 40 130 34 170 M 160 100 Q 180 130 186 170" fill="none" stroke="#666" stroke-width="1.5" opacity=".7"/>
  <!-- trailing leg (viewer right): knee up behind, boot off the ground -->
  <path d="M124 204 L 152 244 L 140 256 L 114 210 Z" fill="#0d0d0d" stroke="#2c2c2c" stroke-width="1"/>
  <path d="M152 244 L 166 274 L 152 284 L 140 256 Z" fill="#0d0d0d" stroke="#2c2c2c" stroke-width="1"/>
  <path d="M150 274 L 170 268 L 176 280 L 154 286 Z" fill="#000"/>
  <!-- forward leg (viewer left): driving toward the viewer, big foreshortened boot -->
  <path d="M96 204 L 82 260 L 100 266 L 112 208 Z" fill="#111" stroke="#333" stroke-width="1"/>
  <path d="M82 260 L 74 298 L 96 300 L 100 266 Z" fill="#111" stroke="#333" stroke-width="1"/>
  <path d="M70 298 L 100 298 L 104 313 L 66 313 Z" fill="#000"/>
  <!-- LEARN / CONQUER down the legs -->
  <g font-family="Arial Black, Arial, sans-serif" font-weight="900" fill="#f2f2f2">
    <text x="86" y="292" font-size="14" transform="rotate(-90 86 292)" letter-spacing="1">LEARN</text>
    <text x="158" y="270" font-size="12" transform="rotate(-70 158 270)" letter-spacing="1">CONQUER</text>
  </g>
  <!-- torso -->
  <path d="M82 86 L 138 86 L 146 158 L 136 212 L 96 212 L 84 158 Z" fill="#111" stroke="#333" stroke-width="1.5"/>
  <!-- CODE chest, extruded: stacked offset copies -->
  <g font-family="Arial Black, Arial, sans-serif" font-weight="900" font-size="30" text-anchor="middle">
    <text x="117" y="152" fill="#5a5a5a">CODE</text>
    <text x="115" y="150" fill="#8a8a8a">CODE</text>
    <text x="113" y="148" fill="#c9c9c9">CODE</text>
    <text x="112" y="147" fill="#ffffff">CODE</text>
  </g>
  <!-- belt -->
  <rect x="88" y="194" width="56" height="9" fill="#000" stroke="#555" stroke-width="1"/>
  <rect x="110" y="194" width="12" height="9" fill="#c9c9c9" stroke="#222"/>
  <!-- head: spiky hair, shadowed face, white eyes -->
  <path d="M96 62 L 88 40 L 102 48 L 104 26 L 114 44 L 126 22 L 130 46 L 144 34 L 138 56 L 150 52 L 138 70 Q 116 80 96 62 Z" fill="#000"/>
  <ellipse cx="116" cy="66" rx="19" ry="20" fill="#0a0a0a"/>
  <path d="M98 60 L 134 60 L 132 72 Q 116 78 100 72 Z" fill="#000"/>
  <ellipse cx="108" cy="66" rx="4.5" ry="2.6" fill="#fff"/>
  <ellipse cx="126" cy="66" rx="4.5" ry="2.6" fill="#fff"/>
  <!-- forward arm (viewer left): pumping toward the viewer, big fist -->
  <path d="M86 96 Q 60 110 52 138 L 64 146 Q 74 122 98 110 Z" fill="#0a0a0a"/>
  <ellipse cx="56" cy="148" rx="11" ry="10" fill="#0a0a0a"/>
  <!-- back arm (viewer right) + Code Sword held up, blade leaning camera-right -->
  <path d="M136 96 Q 160 112 170 138 L 158 146 Q 146 122 128 110 Z" fill="#0a0a0a"/>
  <g transform="rotate(28 168 144)">
    <rect x="163" y="138" width="11" height="26" rx="2" fill="#222" stroke="#888" stroke-width="1"/>
    <rect x="156" y="131" width="24" height="8" rx="2" fill="#666"/>
    <polygon points="168,131 173,62 178,62 178,131" fill="url(#blade)" stroke="#666" stroke-width=".8"/>
    <polygon points="173,62 178,62 175,50" fill="#fff" stroke="#666" stroke-width=".8"/>
  </g>
  <ellipse cx="166" cy="146" rx="9" ry="8" fill="#0a0a0a"/>
  <!-- warm gold rim light (preview style) -->
  <path d="M142 90 L148 158" fill="none" stroke="#e8b73a" stroke-width="2" opacity=".55"/>
  <path d="M104 96 Q 90 130 94 160" fill="none" stroke="#e8b73a" stroke-width="1.5" opacity=".3"/>
</svg>
