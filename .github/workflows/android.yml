name: Android CI

# Compiles the TechieMan React Native app (debug APK) on every push and PR.
# This is the compiler of record for the native side: there is no Android SDK
# on the dev VM by default (see TECHNIMAN_PLAN.md §5.4 — the VM SDK was
# installed by hand on 26 Nov 2026), so CI is where the Android build is
# proven on every change. No secrets, no Firebase config, no signing.
# The debug APK is uploaded as a build artifact for device testing.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install JS dependencies
        run: npm ci

      - name: Typecheck + tests
        run: |
          npx tsc --noEmit
          npm test

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Build debug APK
        run: ./gradlew assembleDebug --no-daemon
        working-directory: android

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: techieman-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
